name: Release

# 公開リポジトリ (j3tm0t0/pix68k) に v で始まるタグを push すると、配るもの (下の 3 つ) を作り、GitHub の Release に載せる。
#   - pix68k-<タグ>.zip: SD カードのルートに展開するもの (tools/make_release.sh)
#   - pix68kcli-*: HTTP の口を操作するコマンドの 7 つ (tools/pix68kcli/build.sh)
#   - SHA256SUMS: 上の 8 つの SHA-256
# リリースの説明は docs/releases/<タグ>.md に、ソースの場所の文を足したもの。タグを push するときにこのファイルがない (か空白だけ) なら、
# Release を作らずに失敗する (公開リポジトリは immutable releases なので、公開したあとは添付を変えられないため)。
#
# GitHub のホストの runner だけで動かす (self-hosted は使わない)。作る job (release-build.yml を呼ぶ build) は読むだけの権限で動かし、
# 書く権限 (contents: write) は Release を作る job にだけ渡す。
#
# workflow_dispatch: タグを打たずに、作るところまでを試す (どのリポジトリでも、どのブランチでも動く)。Release は作らず、
# 載せるはずのファイルとリリースの説明を artifact (release-files) に置く。版の名前は dryrun-<コミットの短い SHA>。
# 公開リポジトリ以外で動かすと、make_release.sh が SOURCE.txt に「試しに作ったもの」と書く。
# 入力 notes_tag (例: v0.2.0。v で始まる名前だけ) を渡すと、説明の本文を docs/releases/<notes_tag>.md で作る (タグを打つ前に、出す説明をそのまま確かめるため)。
# 説明のファイルがない (か空) のと、同じタグの公開済みのリリースがあるのは、最初の version の job で調べて、zip のビルドの前に止める。
#
# beta (人に試してもらう版): タグを v<次の版>-beta.<N> (例: v0.2.3-beta.1) にすると、pre-release で、Latest にせずに出す。
# docs/releases/<タグ>.md はなくてよい。なければ説明の本文を自動で作る: 試験用の版であること、タグのメッセージ (注釈付きのタグなら。
# 元にした開発用のリポジトリのコミットなどを書く)、前のタグからのコミットの一覧。ファイルがあればそちらを使う。
# -beta を含むのに形が違うタグ (v0.2.3-beta、v0.2.3-beta1 など) は止める。正式な版 (-beta のないタグ) の流れは変わらない。
# workflow_dispatch の notes_tag に beta の名前を渡すと、その説明を今のコミットまでの一覧で作って試せる。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes_tag:
        description: '説明の本文に使う docs/releases/<この名前>.md (v で始まる名前。空なら本文なしで試す。v0.2.3-beta.1 のような beta の名前でファイルがなければ、自動の説明で試す)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  version:
    if: github.repository == 'j3tm0t0/pix68k' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      name: ${{ steps.v.outputs.name }}
      notes: ${{ steps.v.outputs.notes }}
      notes_text: ${{ steps.v.outputs.notes_text }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    env:
      NOTES_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.notes_tag || '' }}
    steps:
      # beta の説明にコミットの一覧とタグのメッセージを使うので、履歴とタグを全部取る (作業ツリーは docs/releases だけ)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shell を書かない run は bash -e で、pipefail がない。タグのメッセージを読む gh api | sed の誤りで止めるために足す
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            NAME=$GITHUB_REF_NAME
            NOTES_NAME=$GITHUB_REF_NAME
            REV=refs/tags/$GITHUB_REF_NAME
          else
            NAME=dryrun-${GITHUB_SHA:0:7}
            NOTES_NAME=$NOTES_TAG
            REV=HEAD
          fi
          NOTES=
          BETA=false
          if [ -n "$NOTES_NAME" ]; then
            # 使える字を先に確かめる。確かめる前の値はログに出さない (改行などで workflow command を書けないように)
            case $NOTES_NAME in
              *[!A-Za-z0-9._-]*|*..*) echo "::error::タグ / notes_tag に使えない字がある (英数字と . _ - だけ)"; exit 1 ;;
              v*) ;;
              *) echo "::error::タグ / notes_tag は v で始まる名前にする: $NOTES_NAME"; exit 1 ;;
            esac
            case $NOTES_NAME in
              *-beta*)
                if ! [[ $NOTES_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
                  echo "::error::beta のタグは v<版>-beta.<番号> の形にする (例: v0.2.3-beta.1): $NOTES_NAME"
                  exit 1
                fi
                BETA=true ;;
            esac
            NOTES=docs/releases/$NOTES_NAME.md
            if [ ! -f "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
              if [ "$BETA" = true ]; then
                NOTES=   # beta は説明を自動で作る (下)
              else
                # ない・空・空白だけのファイルでは、足す文だけの説明で公開されてしまうので止める
                echo "::error::$NOTES がない (か空)。タグを付ける前に、リリースの説明をこのファイルに書いてコミットする"
                exit 1
              fi
            fi
          fi
          # beta の説明の本文を作る: 試験用の版であること、タグのメッセージ (注釈付きのタグのとき)、前のタグからのコミットの一覧
          TEXT=
          if [ "$BETA" = true ] && [ -z "$NOTES" ]; then
            TAG_MSG=
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              # actions/checkout は注釈付きのタグを軽量のタグとして作り直すので、タグのメッセージは API で読む。
              # 署名付きのタグの署名の部分は入れない
              OBJ=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$NAME" --jq '.object.type + " " + .object.sha')
              case $OBJ in
                "tag "*)
                  TAG_MSG=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/${OBJ#tag }" --jq .message |
                    sed '/^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d') ;;
              esac
            fi
            # 前のタグは v で始まり数字が続くものだけ (nightly などを拾わない)。v0.2.3-beta1 のように止められて残ったタグは
            # この条件でも拾うので、止まったタグは消す決まり (docs/releases/README.md)。
            # 見つからないときは全履歴の一覧にするが、そのことをログに出す
            if ! PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$REV^" 2>/dev/null); then
              PREV=
              echo "::notice::前のタグが見つからない。コミットの一覧は履歴の初めから (最大 100 件)"
            fi
            if [ -n "$PREV" ]; then RANGE=$PREV..$REV; else RANGE=$REV; fi
            TEXT=$(
              echo "試験用の版 (beta)。正式な版の前に試してもらうためのもの。不具合があれば issue で知らせてほしい。"
              echo
              echo "This is a beta for testing before the next release. Please report problems in the issues."
              if [ -n "$TAG_MSG" ]; then
                echo
                printf '%s\n' "$TAG_MSG"
              fi
              echo
              if [ -n "$PREV" ]; then echo "## $PREV からの変更 (Changes since $PREV)"; else echo "## 変更 (Changes)"; fi
              echo
              # 件名の & と < と ` は、HTML やコードの始まりとして読まれないように文字参照にする。@ はメンションにならないように
              # 後ろにゼロ幅スペース (&#8203;) を入れる (GitHub は文字参照を戻してからメンションを探すので、&#64; では止まらない)。
              # 行の残りの「- 」と短い SHA にはこれらの字はない
              git log --no-merges --format='- %s (%h)' -n 100 "$RANGE" |
                sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/`/\&#96;/g' -e 's/@/@\&#8203;/g'
            )
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$BETA" = false ] && [[ $NAME == *-* ]]; then
            # -beta 以外の付け足し (v0.2.3-rc1 など) は今は扱わない。正式な版として出してしまわないように止める
            echo "::error::タグ $NAME は正式な版 (v<版>) でも beta (v<版>-beta.<番号>) でもない"
            exit 1
          fi
          # 公開済みの同じタグのリリースがあれば、ビルドの前に止める (下書きはこの権限では見えないので、release の job でも調べる)。
          # リリースの一覧を API で読む。読めなければ (認証や API の誤り)「ない」とは見なさず止める
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            FOUND=$(VERSION=$NAME gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.VERSION) | .draft')
            if [ -n "$FOUND" ]; then
              echo "::error::リリース $NAME がすでにある。immutable なので添付を変えられない。新しいタグで出し直す"
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "prerelease=$BETA" >> "$GITHUB_OUTPUT"
          # 複数行の出力。区切りの文字列は本文に出てこない乱数にする
          EOF_MARK=EOF_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
          { echo "notes_text<<$EOF_MARK"; [ -z "$TEXT" ] || printf '%s\n' "$TEXT"; echo "$EOF_MARK"; } >> "$GITHUB_OUTPUT"
          if [ -n "$TEXT" ]; then
            # 本文にはタグのメッセージやコミットの件名が入る。ログに出すときに workflow command (::add-mask:: など) として
            # 読まれないように、stop-commands で囲む (区切りは乱数)
            STOP=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
            echo "--- 自動で作った説明 ---"
            echo "::stop-commands::$STOP"
            printf '%s\n' "$TEXT"
            echo "::$STOP::"
          fi

  # zip、pix68kcli、SHA256SUMS、リリースの説明を作り、artifact (release-files) に置く (release-build.yml)。workflow_dispatch ではここまで
  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.version.outputs.name }}
      notes: ${{ needs.version.outputs.notes }}
      notes_text: ${{ needs.version.outputs.notes_text }}
      require_notes: ${{ github.event_name == 'push' }}

  release:
    needs: [version, build]
    if: github.event_name == 'push' && github.repository == 'j3tm0t0/pix68k'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.name }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - name: Release に載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          mv notes.md ../notes.md
          test "$(ls | wc -l)" = 9   # zip、pix68kcli の 7 つ、SHA256SUMS
          # 公開リポジトリは immutable releases なので、すでにあるリリースには載せ直せない。あれば止める。
          # gh release create は、添付があると下書きで作って添付を載せてから公開する。途中で落ちると下書きが残ることがある
          # (新しい gh は消す)。下書きなら、消してから再実行すればよい
          # リリースの一覧を API で読む (この権限なら下書きも見える)。読めなければ (認証や API の誤り) set -e で止まる
          DRAFT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.VERSION) | .draft')
          case $DRAFT in
            '') ;;
            *true*)
              echo "::error::リリース $VERSION の下書きが残っている。前の実行の残りなら、gh release delete '$VERSION' --repo $GITHUB_REPOSITORY で消してから再実行する"
              exit 1 ;;
            *)
              echo "::error::リリース $VERSION がすでにある。immutable なので添付を変えられない。新しいタグで出し直す"
              exit 1 ;;
          esac
          gh --version
          # beta は pre-release で、Latest にしない (正式な版の Latest を動かさない)
          set --
          if [ "$PRERELEASE" = true ]; then set -- --prerelease --latest=false; fi
          # 念のため: beta の名前なのに pre-release でなければ、正式な版として出してしまわないよう止める
          case $VERSION in *-beta*) [ "$PRERELEASE" = true ] || { echo "::error::$VERSION は beta なのに prerelease が true でない"; exit 1; } ;; esac
          gh release create "$VERSION" ./* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "pix68k $VERSION" --notes-file ../notes.md "$@"
