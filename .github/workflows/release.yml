name: Release

# 公開リポジトリ (j3tm0t0/pix68k) に v で始まるタグを push すると、配るもの (下の 3 つ) を作り、GitHub の Release に載せる。
#   - pix68k-<タグ>.zip: SD カードのルートに展開するもの (tools/make_release.sh)
#   - pix68kcli-*: HTTP の口を操作するコマンドの 7 つ (tools/pix68kcli/build.sh)
#   - SHA256SUMS: 上の 8 つの SHA-256
# リリースの説明は docs/releases/<タグ>.md に、ソースの場所の文を足したもの。タグを push するときにこのファイルがない (か空白だけ) なら、
# Release を作らずに失敗する (公開リポジトリは immutable releases なので、公開したあとは添付を変えられないため)。
#
# GitHub のホストの runner だけで動かす (self-hosted は使わない)。作る job は読むだけの権限で動かし、書く権限 (contents: write)
# は Release を作る job にだけ渡す。
#
# workflow_dispatch: タグを打たずに、作るところまでを試す (どのリポジトリでも、どのブランチでも動く)。Release は作らず、
# 載せるはずのファイルとリリースの説明を artifact (release-files) に置く。版の名前は dryrun-<コミットの短い SHA>。
# 公開リポジトリ以外で動かすと、make_release.sh が SOURCE.txt に「試しに作ったもの」と書く。
# 入力 notes_tag (例: v0.2.0。v で始まる名前だけ) を渡すと、説明の本文を docs/releases/<notes_tag>.md で作る (タグを打つ前に、出す説明をそのまま確かめるため)。
# 説明のファイルがない (か空) のと、同じタグの公開済みのリリースがあるのは、最初の version の job で調べて、zip のビルドの前に止める。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes_tag:
        description: '説明の本文に使う docs/releases/<この名前>.md (v で始まる名前。空なら本文なしで試す)'
        required: false
        default: ''

permissions:
  contents: read

env:
  # pix68kcli のビルドに使う Go の版。上げるときは 2 か所を変える: ここと、公開リポジトリの .github/workflows/ci.yml の pix68kcli の job
  # (公開用の ci.yml はこのリポジトリにはなく、公開に書き出すときに export.sh が差し替える。開発用の ci.yml は Mac の Homebrew の go を使う)
  GO_VERSION: '1.27.4'

jobs:
  version:
    if: github.repository == 'j3tm0t0/pix68k' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      name: ${{ steps.v.outputs.name }}
      notes: ${{ steps.v.outputs.notes }}
    env:
      NOTES_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.notes_tag || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            NAME=$GITHUB_REF_NAME
            NOTES_NAME=$GITHUB_REF_NAME
          else
            NAME=dryrun-${GITHUB_SHA:0:7}
            NOTES_NAME=$NOTES_TAG
          fi
          NOTES=
          if [ -n "$NOTES_NAME" ]; then
            # 使える字を先に確かめる。確かめる前の値はログに出さない (改行などで workflow command を書けないように)
            case $NOTES_NAME in
              *[!A-Za-z0-9._-]*|*..*) echo "::error::タグ / notes_tag に使えない字がある (英数字と . _ - だけ)"; exit 1 ;;
              v*) ;;
              *) echo "::error::タグ / notes_tag は v で始まる名前にする: $NOTES_NAME"; exit 1 ;;
            esac
            NOTES=docs/releases/$NOTES_NAME.md
            # ない・空・空白だけのファイルでは、足す文だけの説明で公開されてしまうので止める
            if [ ! -f "$NOTES" ] || ! grep -q '[^[:space:]]' "$NOTES"; then
              echo "::error::$NOTES がない (か空)。タグを付ける前に、リリースの説明をこのファイルに書いてコミットする"
              exit 1
            fi
          fi
          # 公開済みの同じタグのリリースがあれば、ビルドの前に止める (下書きはこの権限では見えないので、release の job でも調べる)。
          # リリースの一覧を API で読む。読めなければ (認証や API の誤り)「ない」とは見なさず止める
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            FOUND=$(VERSION=$NAME gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.tag_name == env.VERSION) | .draft')
            if [ -n "$FOUND" ]; then
              echo "::error::リリース $NAME がすでにある。immutable なので添付を変えられない。新しいタグで出し直す"
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

  zip:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PREFIX64: aarch64-linux-gnu-
      PIX68K_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: submodule を取得
        run: git submodule update --init --depth 1
      - name: ツールを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu rsync zip unzip curl python3-numpy python3-pil
      - name: zip を作る
        run: tools/make_release.sh "$VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: build/release/pix68k-${{ needs.version.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 7

  cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/pix68kcli
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
      PIX68KCLI_VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: go vet と go test
        run: |
          go version
          go vet ./...
          go test -count=1 ./...
      - name: 7 つをクロスビルド
        run: |
          ./build.sh
          ls -l dist
          test "$(ls dist | wc -l)" = 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-cli
          path: tools/pix68kcli/dist/
          if-no-files-found: error
          retention-days: 7

  # 載せるファイルをそろえ、SHA256SUMS とリリースの説明を作る (読むだけの権限)。workflow_dispatch ではここまで
  assemble:
    needs: [version, zip, cli]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.name }}
      NOTES: ${{ needs.version.outputs.notes }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-cli
          path: dist
      - name: SHA256SUMS とリリースの説明を作る
        run: |
          set -eu
          cd dist
          test -f "pix68k-$VERSION.zip"
          test "$(ls pix68kcli-* | wc -l)" = 7
          sha256sum "pix68k-$VERSION.zip" pix68kcli-* > SHA256SUMS
          cat SHA256SUMS
          cd ..
          # 説明のファイルは version の job で決めて、あることを確かめてある (空なら notes_tag なしの試し)
          if [ -n "$NOTES" ]; then
            test -s "$NOTES"
            cp "$NOTES" notes.md
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error::説明のファイルが決まっていない"; exit 1
          else
            echo "(試し: notes_tag を渡していないので、説明の本文は空)" > notes.md
          fi
          cat >> notes.md <<'EOF'

          ---

          ソースの場所は zip の中の SOURCE.txt と、このタグのソースを参照。Circle は submodule (external/circle) なので、GitHub が自動で付けるソースの zip と tar.gz には入らない。Circle は https://github.com/rsta2/circle の、SOURCE.txt に書いたコミットを使う。添付のファイルの SHA-256 は SHA256SUMS にある。

          See SOURCE.txt in the zip and the source at this tag. Circle is a submodule (external/circle), so it is not included in the source zip and tar.gz that GitHub generates; use the commit of https://github.com/rsta2/circle written in SOURCE.txt. SHA-256 checksums of the attached files are in SHA256SUMS.
          EOF
          mv notes.md dist/notes.md
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [version, assemble]
    if: github.event_name == 'push' && github.repository == 'j3tm0t0/pix68k'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist
      - name: Release に載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          mv notes.md ../notes.md
          test "$(ls | wc -l)" = 9   # zip、pix68kcli の 7 つ、SHA256SUMS
          # 公開リポジトリは immutable releases なので、すでにあるリリースには載せ直せない。あれば止める。
          # gh release create は、添付があると下書きで作って添付を載せてから公開する。途中で落ちると下書きが残ることがある
          # (新しい gh は消す)。下書きなら、消してから再実行すればよい
          # リリースの一覧を API で読む (この権限なら下書きも見える)。読めなければ (認証や API の誤り) set -e で止まる
          DRAFT=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.VERSION) | .draft')
          case $DRAFT in
            '') ;;
            *true*)
              echo "::error::リリース $VERSION の下書きが残っている。前の実行の残りなら、gh release delete '$VERSION' --repo $GITHUB_REPOSITORY で消してから再実行する"
              exit 1 ;;
            *)
              echo "::error::リリース $VERSION がすでにある。immutable なので添付を変えられない。新しいタグで出し直す"
              exit 1 ;;
          esac
          gh --version
          gh release create "$VERSION" ./* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "pix68k $VERSION" --notes-file ../notes.md
