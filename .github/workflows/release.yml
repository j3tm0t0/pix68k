name: Release

# 公開リポジトリ (j3tm0t0/pix68k) に v で始まるタグを push すると、配る zip (tools/make_release.sh) を作り、
# GitHub の Release に載せる。GitHub のホストの runner だけで動かす (self-hosted は使わない)。
# ビルドは読むだけの権限の job で行い、書く権限 (contents: write) は zip を Release に載せる job にだけ渡す。
# 同じタグでやり直したときは、Release があれば zip を上書きし、説明も書き直す
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'j3tm0t0/pix68k'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PREFIX64: aarch64-linux-gnu-
      PIX68K_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: submodule を取得
        run: git submodule update --init --depth 1
      - name: ツールを入れる
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu rsync zip unzip curl
      - name: zip を作る
        run: tools/make_release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-zip
          path: build/release/pix68k-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.repository == 'j3tm0t0/pix68k'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-zip
          path: dist
      - name: Release に載せる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="dist/pix68k-$GITHUB_REF_NAME.zip"
          test -f "$ZIP"
          NOTES="ソースの場所は zip の中の SOURCE.txt と、このタグのソースを参照。Circle は submodule (external/circle) なので、GitHub が自動で付けるソースの zip と tar.gz には入らない。Circle は https://github.com/rsta2/circle の、SOURCE.txt に書いたコミットを使う。"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "pix68k $GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" \
              --title "pix68k $GITHUB_REF_NAME" --notes "$NOTES"
          fi
